<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple Inventory System</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      margin:0;
      padding:20px;
    }

    .container{
      max-width:800px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h1{
      text-align:center;
      color:#333;
    }

    .form-group{
      margin-bottom:15px;
    }

    input{
      width:100%;
      padding:10px;
      margin-top:5px;
      border:1px solid #ccc;
      border-radius:5px;
    }

    button{
      background:#007bff;
      color:white;
      border:none;
      padding:10px 15px;
      border-radius:5px;
      cursor:pointer;
    }

    button:hover{
      background:#0056b3;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    table, th, td{
      border:1px solid #ddd;
    }

    th, td{
      padding:12px;
      text-align:center;
    }

    th{
      background:#007bff;
      color:white;
    }

    .delete-btn{
      background:red;
    }

    .delete-btn:hover{
      background:darkred;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Inventory System</h1>

    <div class="form-group">
      <label>Product Name</label>
      <input type="text" id="productName">
    </div>

    <div class="form-group">
      <label>Quantity</label>
      <input type="number" id="productQty">
    </div>

    <div class="form-group">
      <label>Price</label>
      <input type="number" id="productPrice">
    </div>

    <button onclick="addProduct()">Add Product</button>

    <table>
      <thead>
        <tr>
          <th>Product</th>
          <th>Quantity</th>
          <th>Price</th>
          <th>Total</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="inventoryTable">
      </tbody>
    </table>
  </div>

  <script>
    function addProduct() {
      let name = document.getElementById("productName").value;
      let qty = document.getElementById("productQty").value;
      let price = document.getElementById("productPrice").value;

      if(name === "" || qty === "" || price === ""){
        alert("Please fill all fields");
        return;
      }

      let total = qty * price;

      let table = document.getElementById("inventoryTable");

      let row = table.insertRow();

      row.insertCell(0).innerHTML = name;
      row.insertCell(1).innerHTML = qty;
      row.insertCell(2).innerHTML = "₱" + price;
      row.insertCell(3).innerHTML = "₱" + total;

      row.insertCell(4).innerHTML =
        '<button class="delete-btn" onclick="deleteRow(this)">Delete</button>';

      document.getElementById("productName").value = "";
      document.getElementById("productQty").value = "";
      document.getElementById("productPrice").value = "";
    }

    function deleteRow(button) {
      let row = button.parentNode.parentNode;
      row.parentNode.removeChild(row);
    }
  </script>

</body>
</html>
